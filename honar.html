
<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>هنر؛ روشنایی و رویش زندگی | مهردار</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #d8c892;
      font-family: Tahoma, sans-serif;
      direction: rtl;
      line-height: 2;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    header a {
      color: #d4af37;
      text-decoration: none;
      font-size: 16px;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      padding: 55px 0 80px;
    }

    h1 {
      margin: 0 0 45px;
      color: #d4af37;
      text-align: center;
      font-size: 36px;
      font-weight: normal;
    }

    .art-intro {
      max-width: 760px;
      margin: 0 auto;
      font-size: 19px;
      line-height: 2.4;
      text-align: right;
    }

    .art-intro p {
      margin: 0 0 25px;
    }

    .signature {
      color: #d4af37;
      font-weight: bold;
      margin-top: 35px;
    }

    .gallery-title {
      margin: 70px 0 30px;
      color: #d4af37;
      font-size: 27px;
      font-weight: normal;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 29px;
      }

      .art-intro {
        font-size: 17px;
        line-height: 2.2;
      }

      .gallery-title {
        font-size: 24px;
      }
    }

    .art-sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin: 65px auto 0;
    }

    .art-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 170px;
      padding: 22px;
      box-sizing: border-box;
      border: 1px solid rgba(212, 175, 55, 0.65);
      border-radius: 10px;
      background: #191714;
      color: #d8c892;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .art-card:hover, .art-card:focus-visible {
      background: #272117;
      border-color: #d4af37;
    }

    .art-card h2 {
      color: #d4af37;
      font-size: 24px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .art-card p {
      font-size: 15px;
      margin: 0;
    }

    @media (max-width: 600px) {
      .art-sections { grid-template-columns: 1fr; gap: 16px; }
      .art-card { min-height: 140px; }
      .art-card h2 { font-size: 22px; }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">بازگشت</a>
  </header>

  <main>

    <h1>هنر؛ روشنایی و رویش زندگی</h1>


<section class="art-sections" aria-label="بخش‌های هنر">
      <a class="art-card" href="asar-choobi.html">
        <h2>آثار چوبی</h2>
        <p>دست‌ساخته‌های چوبی مهردار</p>
      </a>
      <a class="art-card" href="khodkar-choobi.html">
        <h2>خودکار و روان‌نویس چوبی</h2>
        <p>دست‌ساخته‌های چوبی مهردار</p>
      </a>
    </section>

  </main>

</body>
</html>
