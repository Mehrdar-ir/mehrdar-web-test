
<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهردار</title>

<style>
/* =========================
   پایه و دسکتاپ
   ========================= */

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background-image: url("bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Tahoma, sans-serif;
    position: relative;
}

.mehrdar-title {
    width: 34%;
    margin: 35px 120px 18px auto;
    text-align: center;
    direction: rtl;
}

.mehrdar-title h1 {
    color: #f2c96b;
    font-size: 44px;
    margin-bottom: 12px;
    font-weight: normal;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
}

.mehrdar-title p {
    color: #e0bd6b;
    font-size: 18px;
    line-height: 1.9;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
}

.menu-container {
    width: 34%;
    margin: 35px 120px 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.menu-item {
    text-decoration: none;
    color: #f2c96b;
    border: 1px solid rgba(242, 201, 107, 0.75);
    padding: 11px 18px;
    text-align: center;
    font-size: 22px;
    border-radius: 7px;
    background: rgba(0,0,0,0.32);
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
    transition: 0.3s;
}

.menu-item:hover {
    background: rgba(242,201,107,0.10);
    color: #ffe08a;
}

.thoughts {
    position: absolute;
    top: 52%;
    left: 58%;
    transform: translate(-50%,-50%);
    font-size: 34px;
    color: #f5e6a8;
    text-shadow: 0 0 12px rgba(0,0,0,0.75);
    letter-spacing: 1px;
}

.thoughts a {
    text-decoration: none;
    color: inherit;
}

.mobile-emblem {
    display: none;
}


/* =========================
   موبایل عمودی
   ========================= */

@media (max-width: 768px) and (orientation: portrait) {

    body {
        display: flex;
        flex-direction: column;
        background-image: url("bg-mobile.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .menu-container {
        width: auto;
        margin: 75px 20px 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        order: 1;
    }

    .menu-item {
        font-size: 18px;
        padding: 10px 12px;
    }

    .mehrdar-title {
        width: auto;
        margin: 55px 20px 10px;
        order: 2;
        text-align: center;
    }

    .mehrdar-title h1 {
        font-size: 36px;
    }

    .mehrdar-title p {
        font-size: 16px;
        line-height: 1.8;
        text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .mobile-emblem {
        display: flex;
        position: absolute;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        z-index: 2;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: #f2c96b;
    }

    .mobile-emblem img {
        width: 58px;
        height: auto;
        display: block;
    }

    .emblem-name {
        margin-top: 5px;
        color: #ffe08a;
        font-size: 15px;
        letter-spacing: 2px;
        text-align: center;
    }

    .emblem-motto {
        margin-top: 4px;
        color: #ffe08a;
        font-size: 13px;
        white-space: nowrap;
        text-align: center;
        direction: rtl;
    }

    .thoughts {
        font-size: 22px;
    }
}


/* =========================
   موبایل افقی
   ========================= */

@media (max-width: 932px) and (orientation: landscape) {

    body {
        display: block;
        height: 100dvh;
        background-image: url("bg.png");
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
    }

    .mehrdar-title {
        width: 34%;
        margin: 18px 90px 20px auto;
        text-align: center;
        direction: rtl;
    }

    .mehrdar-title h1 {
        font-size: 38px;
        margin-bottom: 8px;
    }

    .mehrdar-title p {
        font-size: 16px;
        line-height: 1.7;
    }

    .menu-container {
    width: 44%;
    margin: 0 145px 0 auto;
    display: flex;
    flex-direction: row;
    direction: rtl;
    gap: 7px;
}

.menu-item {
    flex: 0 0 78px;
    font-size: 13px;
    padding: 3px 2px;
}

 .mobile-emblem {
    display: none;
}
}
</style>

</head>

<body>
  <div class="mehrdar-title">
  <h1>مهردار</h1>
<p class="tagline">بازخوانی جهان‌بینی ایرانی<br>و کارآمدی آن برای زندگی امروز</p>
</div>

  <a href="goftarha.html" class="menu-item">گفتارها</a>

<a href="neveshteha.html" class="menu-item">نوشته‌ها</a>

<a href="about.html" class="menu-item">دربارهٔ مهردار</a>

</div>
  <div class="mobile-emblem">
    <img src="mehrdar-1.png" alt="نشان مهردار">
    <div class="emblem-name">MEHRDAR</div>
<div class="emblem-motto">خرد · اندیشهٔ نیک · راستی</div>
</div>

</body>

</html>
